[package]
name = "clipx-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
clipx-store = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RapidOCR ONNX：由 clipx-app 的默认 feature `ocr-rapid` 打开（约 +25MB）。
# 应急瘦身：cargo build -p clipx-app --no-default-features
rapidocr-core = { version = "0.2.2", optional = true }

[features]
rapid = ["dep:rapidocr-core"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Media_Ocr",
    "Globalization",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Win32_System_WinRT",
] }

[dev-dependencies]
clipx-core = { workspace = true }
tempfile = "3"
