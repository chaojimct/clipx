name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux 系统依赖（Slint fontconfig + 托盘 GTK）
        if: runner.os == 'Linux'
        run: |
          # runner 自带的 microsoft-prod 源偶发 403，更新前移除
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 预置 onnx 占位 DLL（ort-sys copy-dylibs 在 CI 必挂，见注释）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 上游 ort-sys 构建脚本的 copy_dylibs 在 GitHub Windows runner 上稳定失败：
          #   thread 'main' panicked at dynamic_link.rs:42 (fs::copy) Os { code: 3, NotFound }
          # read_dir 能列出文件（故不是缺目录/缺下载）但 copy 落盘报"路径不存在"；
          # 最小复现构建产物为 0 字节，指向 runner 沙箱在下载解压与拷贝之间动了文件
          # （本地 dev-mode 走 symlink 分支，根本练不到这条路，故本地不可复现）。
          # 对策：占位文件让 `if !out_path.exists()` 直接跳过 copy+symlink 全部分支。
          # out_dir 取值有两种可能（cargo 版本差异：nth(3) 可能是 target\debug 也可能是
          # target\debug\build），两边都预置，覆盖所有情况。
          $dirs = @('target\debug', 'target\debug\examples', 'target\debug\deps', 'target\debug\build', 'target\debug\build\examples', 'target\debug\build\deps')
          # 安全前提（缺一不可，改了任何一条重审本 step）：
          #   1. cargo test 不创建 ort 会话（clipx-ocr 单测只验资产清单/模型就绪；
          #      live_download_models 已 ignore），故运行时不需要真 DLL；
          #   2. 链接走下载缓存里的真 onnxruntime.lib（静态链接，不受占位影响）。
          # 耦合：占位文件名必须与当前 ort dist 内的 .dll 同名（见 Cargo.lock ort 版本；
          #   dist 加新 DLL 会重新 panic，届时同步加名）。已有真文件则保留（不覆盖）。
          foreach ($d in $dirs) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
            $p = Join-Path $d 'DirectML.dll'
            if (-not (Test-Path $p)) { New-Item -ItemType File -Path $p | Out-Null }
          }
          Write-Host "PWD: $(Get-Location)"
          Write-Host '--- 占位校验 ---'
          Get-ChildItem target\debug\DirectML.dll, target\debug\examples\DirectML.dll, target\debug\deps\DirectML.dll, target\debug\build\DirectML.dll, target\debug\build\examples\DirectML.dll, target\debug\build\deps\DirectML.dll -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "$($_.FullName) len=$($_.Length)" }
          Write-Host '--- ort-sys 构建目录结构（确认 nth(3) 落点） ---'
          Get-ChildItem target\debug\build -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'ort-sys*' } | ForEach-Object { Write-Host $_.FullName }
          Write-Host '--- ort 下载缓存（构建前） ---'
          Get-ChildItem $env:LOCALAPPDATA\ort.pyke.io -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "$($_.FullName) len=$($_.Length)" }

      - name: 工作区测试（三平台）
        run: cargo test --workspace --locked

      - name: ort 复制现场取证（失败时）
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host '--- 占位文件事后状态 ---'
          Get-ChildItem target\debug\DirectML.dll, target\debug\examples\DirectML.dll, target\debug\deps\DirectML.dll, target\debug\build\DirectML.dll, target\debug\build\examples\DirectML.dll, target\debug\build\deps\DirectML.dll -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "$($_.FullName) len=$($_.Length) mode=$($_.Mode)" }
          Write-Host '--- ort-sys 构建目录结构（确认 nth(3) 落点） ---'
          Get-ChildItem target\debug\build -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'ort-sys*' } | ForEach-Object { Write-Host $_.FullName }
          Get-ChildItem target\debug\build\ort-sys -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "nested: $($_.FullName)" }
          Write-Host '--- out 目录内容 ---'
          Get-ChildItem target\debug -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "$($_.Name) len=$($_.Length)" }
          Write-Host '--- ort 下载缓存事后状态 ---'
          Get-ChildItem $env:LOCALAPPDATA\ort.pyke.io -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "$($_.FullName) len=$($_.Length)" }
          Write-Host '--- 手动复现 copy ---'
          $src = Get-ChildItem $env:LOCALAPPDATA\ort.pyke.io -Recurse -Filter DirectML.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($src) {
            Copy-Item $src.FullName 'target\debug\REPROBE_DirectML.dll' -ErrorAction Continue
            if (Test-Path 'target\debug\REPROBE_DirectML.dll') { Write-Host 'REPRO COPY OK' } else { Write-Host 'REPRO COPY FAILED' }
          } else { Write-Host 'NO SRC DLL IN CACHE' }

  cross-check:
    name: cross-check (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # 纯 Rust 层跨平台编译防火墙：core/monitor/everything/filejump/host 必须在
      # 非 Windows 目标下保持干净（store/app 的 bundled C 依赖在交叉环境不可编，
      # 真实三平台编译由上面的 test 矩阵覆盖）
      - name: 纯 Rust crate 跨平台检查
        run: cargo check --locked --target ${{ matrix.target }} -p clipx-core -p clipx-monitor -p clipx-everything -p clipx-filejump -p clipx-host -p clipx-vault
