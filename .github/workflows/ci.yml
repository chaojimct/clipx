name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux 系统依赖（Slint fontconfig + 托盘 GTK）
        if: runner.os == 'Linux'
        run: |
          # runner 自带的 microsoft-prod 源偶发 403，更新前移除
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 工作区测试（三平台）
        run: cargo test --workspace --locked

  cross-check:
    name: cross-check (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # 纯 Rust 层跨平台编译防火墙：core/monitor/everything/filejump 必须在
      # 非 Windows 目标下保持干净（store/app 的 bundled C 依赖在交叉环境不可编，
      # 真实三平台编译由上面的 test 矩阵覆盖）
      - name: 纯 Rust crate 跨平台检查
        run: cargo check --locked --target ${{ matrix.target }} -p clipx-core -p clipx-monitor -p clipx-everything -p clipx-filejump
