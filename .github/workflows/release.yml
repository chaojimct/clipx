name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.10.7）"
        required: true
        default: "0.10.24"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"
          echo "version=$V"

  build-windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 预置 onnx 占位 DLL（同 ci.yml 注释；out_dir 两种可能都覆盖）
        shell: pwsh
        run: |
          foreach ($d in @('target\release', 'target\release\examples', 'target\release\deps', 'target\release\build', 'target\release\build\examples', 'target\release\build\deps')) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
            $p = Join-Path $d 'DirectML.dll'
            if (-not (Test-Path $p)) { New-Item -ItemType File -Path $p | Out-Null }
          }

      - name: 构建 release（含 rc.exe 图标嵌入与 ShellNavigate DLL staging）
        run: cargo build --release --locked -p clipx-app

      - name: 构建 TSF 光标信标 DLL（x64 + x86）
        shell: pwsh
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --release --locked -p clipx-tsf
          cargo build --release --locked -p clipx-tsf --target i686-pc-windows-msvc
          # x86 版改名放进主产物目录：32 位宿主（企业微信/WPS/腾讯会议…）
          # 要靠它自装 WH_GETMESSAGE 钩子（x64 进程装不进 WOW64 进程）。
          $src = Join-Path $env:GITHUB_WORKSPACE "target\i686-pc-windows-msvc\release\clipx_caret_beacon.dll"
          $dst = Join-Path $env:GITHUB_WORKSPACE "target\release\clipx_caret_beacon32.dll"
          Copy-Item $src $dst -Force
          Write-Host "OK: $dst"

      - name: 落位 ShellNavigate DLL（build.rs 静默跳过时兜底，失败即报错）
        shell: pwsh
        run: |
          # build.rs 的 stage_shell_navigate_dlls 用 let _ 吞掉拷贝错误，
          # 在 CI runner 上曾静默丢失（校验步骤才暴露）。这里显式拷贝 + 报错。
          $ws = $env:GITHUB_WORKSPACE
          Copy-Item (Join-Path $ws 'native\ShellNavigate\x64\Release\ClipboardXShellNavigate.dll') (Join-Path $ws 'target\release\ClipboardXShellNavigate.dll') -Force -ErrorAction Stop
          Copy-Item (Join-Path $ws 'native\ShellNavigate\Win32\Release\ClipboardXShellNavigate32.dll') (Join-Path $ws 'target\release\ClipboardXShellNavigate32.dll') -Force -ErrorAction Stop
          Get-ChildItem (Join-Path $ws 'target\release\ClipboardXShell*.dll') | ForEach-Object { Write-Host "staged: $($_.Name) $($_.Length)" }

      - name: 校验 exe 与随包 DLL
        shell: pwsh
        run: |
          $rel = Join-Path $env:GITHUB_WORKSPACE "target\release"
          foreach ($f in @("clipx.exe", "ClipboardXShellNavigate.dll", "ClipboardXShellNavigate32.dll", "clipx_caret_beacon.dll", "clipx_caret_beacon32.dll")) {
            $p = Join-Path $rel $f
            if (-not (Test-Path $p)) { throw "缺少产物: $p" }
            Write-Host "OK: $p"
          }

      - name: 落盘 onnx 运行库真 DLL（覆盖占位；精度 OCR 运行时必需）
        shell: pwsh
        run: |
          # 构建时 copy-dylibs 被占位跳过（见 ci.yml 注释）；这里从 ort 下载缓存取真 DLL
          # 覆盖占位，供 Inno 打包（精度 OCR 运行时必需；模型仍按需下到 Data/ocr-models）。
          # 缓存路径耦合 ort 版本（见 Cargo.lock）：单哈希目录，取最新。
          $cache = Join-Path $env:LOCALAPPDATA 'ort.pyke.io\dfbin\x86_64-pc-windows-msvc'
          $dlls = Get-ChildItem $cache -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending
          if (-not $dlls) { throw "ort 下载缓存里没有 DLL（下载失败？）：$cache" }
          $dlls | ForEach-Object { Write-Host "cache: $($_.FullName) $($_.Length)" }
          $rel = Join-Path $env:GITHUB_WORKSPACE 'target\release'
          foreach ($d in @($rel, (Join-Path $rel 'examples'), (Join-Path $rel 'deps'))) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
            foreach ($f in $dlls) { Copy-Item $f.FullName (Join-Path $d $f.Name) -Force }
          }
          Get-ChildItem (Join-Path $rel '*.dll') | ForEach-Object { Write-Host "staged: $($_.Name) $($_.Length)" }

      - name: 安装 Inno Setup 并制包
        shell: pwsh
        run: |
          choco install innosetup -y
          $iscc = "$(${env:ProgramFiles(x86)})\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "未找到 ISCC" }
          $ws = $env:GITHUB_WORKSPACE
          $v = "${{ needs.meta.outputs.version }}"
          $publish = "/DPublishDir=" + (Join-Path $ws "target\release").Replace('\', '/')
          $dll = "/DDllDir=" + (Join-Path $ws "native\ShellNavigate").Replace('\', '/')
          & $iscc /DAppVersion=$v $publish $dll (Join-Path $ws "scripts\clipx.iss")

      - name: 打 Windows 便携包（解压即用，issue #1）
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $v = "${{ needs.meta.outputs.version }}"
          $rel = Join-Path $ws 'target\release'
          $port = Join-Path $ws 'portable'
          New-Item -ItemType Directory -Force -Path $port | Out-Null
          # exe + 随包 DLL（校验清单见上；onnx 运行库取缓存里刚落盘的真 DLL）。
          # 当前 ort 发行版是静态链接，只带 DirectML.dll；onnxruntime.dll 缺席是正常的
          # （未来 dist 若改出共享库，这行自动生效），缺失只告警不中断。
          foreach ($f in @("clipx.exe", "ClipboardXShellNavigate.dll", "ClipboardXShellNavigate32.dll", "clipx_caret_beacon.dll", "clipx_caret_beacon32.dll", "DirectML.dll")) {
            $p = Join-Path $rel $f
            if (-not (Test-Path $p)) { throw "便携包缺少文件: $p" }
            Copy-Item $p $port -Force
          }
          $ort = Join-Path $rel 'onnxruntime.dll'
          if (Test-Path $ort) { Copy-Item $ort $port -Force } else { Write-Host "WARN: 无 onnxruntime.dll（当前 dist 为静态链接，预期内），跳过" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path (Join-Path $port '*') -DestinationPath "dist/clipx-$v-win-x64-portable.zip" -Force
          Get-ChildItem dist | ForEach-Object { Write-Host "artifact: $($_.Name)" }

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path . -Recurse -Filter "clipx-*-setup.exe" -File |
            Where-Object { $_.FullName -notlike "*\target\release\*" -or $_.Name -like "clipx-*-setup.exe" } |
            ForEach-Object { Copy-Item $_.FullName dist\ -Force }
          Get-ChildItem dist -File | ForEach-Object { Write-Host "artifact: $($_.Name)" }
          if (-not (Get-ChildItem dist -Filter "*.exe" -File -ErrorAction SilentlyContinue)) {
            Get-ChildItem -Path . -Recurse -Filter "clipx-*-setup.exe" -File | ForEach-Object { Write-Host "found: $($_.FullName)" }
            throw "未找到安装包"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipx-windows
          path: dist/*

  build-macos:
    needs: meta
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 构建 release
        run: |
          mkdir -p target/release/examples target/release/deps
          cargo build --release --locked -p clipx-app

      - name: 组装 clipx.app（未签名）
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          APP=dist/clipx.app/Contents
          mkdir -p "$APP/MacOS" "$APP/Resources"
          cp target/release/clipx "$APP/MacOS/clipx"
          cat > "$APP/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>clipx</string>
            <key>CFBundleDisplayName</key><string>clipx</string>
            <key>CFBundleIdentifier</key><string>dev.clipx.app</string>
            <key>CFBundleExecutable</key><string>clipx</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSAppleEventsUsageDescription</key><string>clipx 需要向 Finder 发送事件以获取当前路径与定位文件。</string>
          </dict></plist>
          EOF
          # 未签名：首次打开需右键 → 打开（绕过 Gatekeeper）

      - name: 打 dmg
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          hdiutil create -volname clipx -srcfolder dist -ov -format UDZO "dist/clipx-${VERSION}-macos.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipx-macos
          path: dist/*.dmg

  build-linux:
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux 系统依赖
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 构建 release
        run: |
          mkdir -p target/release/examples target/release/deps
          cargo build --release --locked -p clipx-app

      - name: 打 deb + tar.gz
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # deb
          PKG=pkgroot
          rm -rf "$PKG"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/256x256/apps"
          cp target/release/clipx "$PKG/usr/bin/clipx"
          cp crates/clipx-app/assets/clipboard.ico "$PKG/usr/share/icons/hicolor/256x256/apps/clipx.ico"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: clipx
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: clipx
          Description: clipx clipboard manager (Rust + Slint)
          EOF
          cat > "$PKG/usr/share/applications/clipx.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=clipx
          Comment=剪贴板管理器
          Exec=clipx
          Icon=clipx
          Terminal=false
          Categories=Utility;
          EOF
          dpkg-deb --build "$PKG" "dist/clipx_${VERSION}_amd64.deb"
          # 便携 tar.gz（Data/ 与 exe 同级）
          tar -C target/release -czf "dist/clipx-${VERSION}-linux-x64.tar.gz" clipx
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipx-linux
          path: dist/*

  publish:
    needs: [meta, build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: clipx-*
          merge-multiple: true
          path: dist

      - name: List
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: clipx ${{ needs.meta.outputs.version }}
          files: dist/*
          generate_release_notes: true
